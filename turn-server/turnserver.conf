# Minimal coturn config for the voice-call PoC.
# Auth secret and realm are overridden at runtime via CLI flags in docker-compose.yml
# (so they can come from .env instead of being baked into this file).

listening-port=3478
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
use-auth-secret

# Local dev only: lets the relay talk to peers on loopback/private ranges,
# which is normally blocked for security. Remove this for any real deployment.
allow-loopback-peers

no-cli
no-tls
no-dtls

verbose
log-file=stdout
